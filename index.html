<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>통합 인증 로드맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 박람회 화면 1의 QR을 찍으면 열리는 휴대폰 화면. 판정·서류는 화면 1과 같은 코드(build.py가 template.html 의 공통 부분을 넣음).
   인트라넷 기록(건수·사례)은 싣지 않는다 — 법령 판정과 부서 이름만 */
:root {
  --bg: #F5F2EB; --paper: #FFFFFF; --paper2: #FAF8F3;
  --ink: #1C2421; --soft: #3C4641; --muted: #59625D; --dim: #A2A9A4; --line: #E5E0D5; --line2: #D5CEC0;
  --accent: #2F5D4B; --accent-2: #E6EEE8; --accent-3: #BED4C6; --accent-deep: #1F4436;
  --warm: #A0482A; --warm-2: #F8E6DC; --warm-3: #E8A587; --warm-deep: #6E2E16;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.5; }
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
.brand { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.brand small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 13px; }

.hero { margin-top: 14px; background: var(--accent); color: #fff; border-radius: 20px; padding: 18px 18px 16px; }
.hero .k { font-size: 11px; letter-spacing: .12em; font-weight: 800; color: rgba(255,255,255,.72); }
.hero h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 0; letter-spacing: -0.02em; }
.hero .s { font-size: 14px; color: rgba(255,255,255,.86); margin-top: 2px; }
.hero .n { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hero .n b { font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.hero .n span { font-size: 16px; font-weight: 800; }
.hero .n em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--warm-deep); background: var(--warm-3); padding: 2px 9px; border-radius: 999px; margin-left: 4px; }
.pickers { display: grid; grid-template-columns: 1.1fr 1fr 1.1fr; gap: 6px; margin-top: 10px; }
.pickers label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.pickers select { width: 100%; font: inherit; font-size: 14px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line2); background: var(--paper); color: var(--ink); }

h2 { font-size: 19px; margin: 30px 0 4px; letter-spacing: -0.01em; }
.sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

.cert { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-top: 8px; }
.cert.check { border: 1.5px dashed var(--warm-3); }
.cert.none { background: var(--paper2); }
.cert.none .nm, .cert.none ul { color: var(--muted); }
.cert .top { display: flex; align-items: center; gap: 8px; }
.cert .nm { font-size: 17px; font-weight: 800; }
.cert .dp { font-size: 12px; color: var(--muted); }
.st { margin-left: auto; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; flex: none; }
.st.must { background: var(--accent); color: #fff; }
.st.check { color: var(--warm); background: var(--warm-2); }
.st.none { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); }
.cert ul { margin: 7px 0 0; padding-left: 17px; font-size: 14px; color: var(--soft); }
.cert .who { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--soft); }
.tagi { font-style: normal; font-weight: 800; color: var(--accent); background: var(--accent-2); padding: 1px 6px; border-radius: 5px; margin-right: 6px; font-size: 11px; }

.stg { position: relative; padding: 0 0 14px 34px; }
.stg::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: 0; width: 2px; background: var(--line2); }
.stg:last-child::before { display: none; }
.stg .dot { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 13px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
.stg.hot .dot { background: var(--warm-3); color: var(--warm-deep); }
.stg.off .dot { background: var(--paper); box-shadow: inset 0 0 0 2px var(--line2); color: var(--dim); }
.stg h3 { font-size: 16px; margin: 0; padding-top: 2px; display: flex; align-items: baseline; gap: 8px; }
.stg h3 small { font-size: 12px; color: var(--muted); font-weight: 500; }
.stg h3 em { font-style: normal; margin-left: auto; font-size: 12px; font-weight: 800; color: var(--accent-deep); background: var(--accent-2); padding: 2px 9px; border-radius: 999px; flex: none; }
.stg.hot h3 em { color: var(--warm-deep); background: var(--warm-3); }
.stg.off h3 { color: var(--dim); }
.stg ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.stg li { font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--accent-2); }
.stg li b { display: block; font-size: 12px; color: var(--accent); font-weight: 800; }
.stg li.chk { background: var(--warm-2); }
.stg li.chk b { color: var(--warm); }
.stg li.ref { background: none; border: 1px dashed var(--line2); color: var(--muted); }
.stg li.ref b { color: var(--muted); }

.doc { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; }
.doc.chk { border: 1.5px dashed var(--warm-3); }
.doc h4 { margin: 0 0 4px; font-size: 15px; color: var(--accent); }
.doc.chk h4 { color: var(--warm); }
.doc ul { margin: 0; padding-left: 17px; font-size: 14px; color: var(--soft); }
.doc .ex { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 6px; }
.doc .ex + ul { color: var(--muted); }
.cm { font-size: 11px; font-weight: 800; color: var(--warm-deep); background: var(--warm-3); padding: 1px 6px; border-radius: 5px; margin-left: 4px; white-space: nowrap; }

.desk { margin-top: 30px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.desk h2 { margin: 0 0 4px; }
.deps { margin-top: 8px; }
.dep { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.dep b { font-weight: 800; }
.dep small { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-2); padding: 1px 6px; border-radius: 5px; }
.dep.chk small { color: var(--warm); background: var(--warm-2); }
.dep a { margin-left: auto; flex: none; font-weight: 800; color: #fff; background: var(--accent); text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-variant-numeric: tabular-nums; }
.main-tel { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 14px; color: var(--soft); }
.main-tel a { color: var(--accent-deep); font-weight: 800; }
.desk .src { font-size: 11px; color: var(--muted); margin: 10px 0 0; }
.foot { margin-top: 24px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">KEGE<small>(사)한국교육녹색환경연구원</small></div>
  <div class="hero" id="hero"></div>
  <div class="pickers" id="pickers"></div>

  <h2>연구 및 인증 여섯 가지</h2>
  <p class="sub">의무인지, 누가 신청하는지</p>
  <div id="certs"></div>

  <h2>단계별 할 일</h2>
  <p class="sub">N가지 = 그 단계에 할 일이 있는 연구 및 인증 · 같은 일은 한 줄로 묶음</p>
  <div id="road"></div>

  <h2>인증별 필요한 도서·서류</h2>
  <p class="sub">법령이 정한 서류 · '주요 도서 예'는 인증기관 해설서 항목별 제출서류 · <span class="cm">공통</span> = 다른 인증과 함께 준비</p>
  <div id="docs"></div>

  <div class="desk">
    <h2>상담 창구</h2>
    <p class="sub">한 창구에서 함께 안내합니다. 번호를 누르면 바로 전화가 걸립니다.</p>
    <div class="main-tel" id="main-tel"></div>
    <div class="deps" id="deps"></div>
    <p class="src">연락처: 연구원 홈페이지 '오시는 길' 부서별 대표연락처</p>
  </div>
  <p class="foot" id="foot"></p>
</div>

  const w = s.what;
  if (/^사전기획/.test(w)) return "사전기획(설계 전)";
  if (/^적정성 검토/.test(w)) return "적정성 검토(입찰공고 전)";
  if (/^에너지 절약계획서 제출/.test(w)) return "허가 신청 때 제출";
  if (/^검토기관 검토.*10일/.test(w)) return "검토 10일";
  if (/^예비인증(?! 유효기간|으로|은)/.test(w)) return "예비인증";
  if (/^본인증.*사용승인 후 2년/.test(w)) return "본인증(사용승인 뒤 2년 안)";
  const m = w.match(/^본인증.*?(\d+)일 이내/); if (m) return `본인증(${m[1]}일)`;
  if (/^이미 인증받은 학교를 500㎡ 이상 증축/.test(w)) return "500㎡ 이상 증축이면 2년 안 재인증";
  return null;  /* 유효기간·효력 같은 주의사항은 칸에서 뺀다(조문 보기에 있음) */
}
const stageIdx = (cert, st) => st === "before" || st === "design" || st === "permit" ? 0 : st === "done" ? 1 : cert === "edu" ? 2 : 1;
function buildItems(r, v) {
  const items = {}; DOM.forEach(d => items[d.key] = [[], [], [], [], []]);
  const add = (k, st, text, ref) => { const a = items[k][st]; if (!a.some(t => t.text === text)) a.push({ text, ref }); };
  const isNew = ["신축", "전부개축"].includes(pick.a);  /* 증축은 엔진 단계에 재인증이 이미 있음 */
  v.forEach(x => {
    if (x.status === "해당 없음") return;
    r.steps.filter(s => s.cert === x.key).forEach(s => { const t = chipText(s); if (t) add(x.key, stageIdx(s.cert, s.stage), t); });
    if (x.status !== "의무") return;
    if (x.key === "bf") add("bf", 3, "유효기간 연장");
    if (x.key === "edu") { add("edu", 3, "유효기간 뒤 재인증"); if (isNew) add("edu", 4, "증축·개축 때 재인증"); }
  });
  if (pick.f === "pubsch" || pick.f === "prisch") add("plan", 4, "개축 타당성·공간재구조화", true);  /* 교육청 사업 절차(법정 의무 아님) */
  return items;
}
/* 인증별 도서·서류: 법령이 정한 서류(엔진) + 증명 서류의 주요 도서 예(해설서) */
const DOCSHORT = [
  [/^설계도면·설계설명서·계산서.*$/, "설계도면·설계설명서·계산서(건축·기계·전기·신재생)"],
  [/^최종 설계도면.*$/, "최종 설계도면(건축·기계·전기·신재생)"],
  [/^건축물에너지관리시스템 설치 확인 서류$/, "BEMS 설치 확인 서류"],
  [/^자체평가서\(별표 3 인증심사기준\)$/, "자체평가서(인증심사기준)"],
  [/^인증에 필요한 사실을 증명하는 서류$/, "사실 증명 서류"],
  [/^자체평가서 내용을 증명하는 서류$/, "자체평가서 내용 증명 서류"],
  [/^사업계획서.*$/, "사업계획서(공간구성·사업규모·사업비·발주방식 등)"],
];
const docShort = s => { for (const [re, t] of DOCSHORT) if (re.test(s)) return t; return s; };
function docList(r, v) {
  const shown = v.filter(x => x.status !== "해당 없음");
  const docs = r.docs.filter(d => shown.some(x => x.key === d.cert));
  const mustOf = d => v.find(x => x.key === d.cert).status === "의무";
  const nDraw = docs.filter(d => mustOf(d) && d.items.some(i => /도면/.test(i))).length;
  const nSelf = docs.filter(d => mustOf(d) && d.items.some(i => /자체평가/.test(i))).length;
  return shown.map(x => {
    const d = docs.find(e => e.cert === x.key); if (!d) return null;
    const m = x.status === "의무";
    let items = d.items.map(i => ({ t: docShort(i), cm: m && ((/도면/.test(i) && nDraw > 1) || (/자체평가/.test(i) && nSelf > 1)) }));
    if (x.key === "zeb") {  /* 여덟 가지를 화면에 맞게 묶음(원문은 조문 보기에) */
      items = [items[0], { t: "부위별 성능내역서·건물 전개도" }, { t: "장비용량·조명밀도 계산서" }, { t: "자재·기기·설비 성능 증명 서류" }, { t: "설계변경 확인서·설명서" }, items[items.length - 1]];
    }
    return { x, items, ex: (DG.docex[x.key] || {}).items || [], cite: d.cite };
  }).filter(Boolean);
}
const pickText = () => `${FAC_L[pick.f]} · ${ACT_UI[pick.a][0]} · ${AREA_L[pick.z]}`;
/*</공통>*/

/* ?r=시설·공사·면적 번호(예 004 = 공립 초·중·고 · 신축 · 3,000㎡ 이상) */
(() => {
  const r = new URLSearchParams(location.search).get("r") || "";
  const f = DG.fac[+r[0]], a = DG.act[+r[1]], z = DG.area[+r[2]];
  if (/^\d{3}$/.test(r) && f && a && z) pick = { f: f[0], a: a[0], z: z[0] };
})();
const code = () => [[DG.fac, pick.f], [DG.act, pick.a], [DG.area, pick.z]].map(([l, k]) => l.findIndex(x => x[0] === k)).join("");

$("#pickers").innerHTML = [["f", "시설", DG.fac.map(([k, l]) => [k, l])], ["a", "공사", DG.act.map(([k]) => [k, ACT_UI[k][0]])], ["z", "연면적", DG.area]]
  .map(([key, lab, opts]) => `<div><label for="p-${key}">${lab}</label><select id="p-${key}" data-k="${key}">${opts.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select></div>`).join("");
document.querySelectorAll("#pickers select").forEach(el => el.addEventListener("change", () => {
  pick[el.dataset.k] = el.value;
  history.replaceState(null, "", "?r=" + code());
  render();
}));

function render() {
  document.querySelectorAll("#pickers select").forEach(el => { el.value = pick[el.dataset.k]; });
  const r = rec(), v = verdicts(r), items = buildItems(r, v);
  const must = v.filter(x => x.status === "의무"), chk = v.filter(x => x.status === "확인 필요");
  $("#hero").innerHTML = `<div class="k">KEGE · 통합 인증 로드맵</div><h1>${esc(FAC_L[pick.f])} ${esc(ACT_UI[pick.a][0])}</h1>
    <div class="s">연면적 ${esc(AREA_L[pick.z])} · 2026. 10. 1. 시행 조문 기준</div>
    <div class="n"><b>${must.length}</b><span>가지 의무</span>${chk.length ? `<em>확인 필요 ${chk.length}</em>` : ""}</div>`;

  $("#certs").innerHTML = v.map(x => `<div class="cert ${stCls(x.status)}"><div class="top"><span class="nm">${esc(x.short)}</span><span class="dp">${esc(x.dept)}</span><span class="st ${stCls(x.status)}">${esc(x.status)}</span></div>
    <ul>${x.why.slice(0, 3).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    ${x.status === "해당 없음" ? "" : `<div class="who"><i class="tagi">신청</i>${esc(whoOf(x.key))}</div>`}</div>`).join("");

  /* 화면 1 로드맵 장과 같은 묶음: 한 인증의 일은 한 줄, 같은 일을 하는 인증은 한 줄에 함께 */
  const cnt = STAGES.map((_, k) => v.filter(x => x.status !== "해당 없음" && items[x.key][k].some(t => !t.ref)).length), mx = Math.max(...cnt);
  $("#road").innerHTML = STAGES.map((st, k) => {
    const rows = [];
    v.forEach(x => {
      if (x.status === "해당 없음") return;
      const it = items[x.key][k]; if (!it.length) return;
      const cls = it[0].ref ? "ref" : x.status === "확인 필요" ? "chk" : "", text = it.map(t => t.text).join(" → ");
      const same = rows.find(rw => rw.text === text && rw.cls === cls);
      if (same) same.names.push(x.short); else rows.push({ names: [x.short + (it[0].ref ? " · 참고" : "")], text, cls });
    });
    const hot = cnt[k] === mx && mx > 0;
    return `<div class="stg ${hot ? "hot" : cnt[k] ? "" : rows.length ? "" : "off"}"><div class="dot">${k + 1}</div>
      <h3>${esc(st)}<small>${esc(STAGE_SUB[k])}</small>${cnt[k] ? `<em>${cnt[k]}가지</em>` : ""}</h3>
      ${rows.length ? `<ul>${rows.map(rw => `<li class="${rw.cls}"><b>${esc(rw.names.join(" · "))}</b>${esc(rw.text)}</li>`).join("")}</ul>` : ""}</div>`;
  }).join("");

  const L = docList(r, v);
  $("#docs").innerHTML = L.length ? L.map(d => `<div class="doc ${d.x.status === "확인 필요" ? "chk" : ""}"><h4>${esc(d.x.short)}</h4><ul>${d.items.map(i => `<li>${esc(i.t)}${i.cm ? `<span class="cm">공통</span>` : ""}</li>`).join("")}</ul>` +
    (d.ex.length ? `<div class="ex">주요 도서 예</div><ul>${d.ex.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "") + `</div>`).join("")
    : `<p class="sub">의무인 연구 및 인증이 없어 낼 서류가 없습니다.</p>`;

  $("#main-tel").innerHTML = `대표 <a href="tel:${MAIN_TEL}">${MAIN_TEL}</a>`;
  $("#deps").innerHTML = [...must, ...chk].map(x => `<div class="dep ${x.status === "의무" ? "" : "chk"}"><b>${esc(x.dept)}</b><small>${esc(x.short)}</small><a href="tel:${x.tel}">${x.tel}</a></div>`).join("")
    || `<div class="dep"><b>(사)한국교육녹색환경연구원</b><a href="tel:${MAIN_TEL}">${MAIN_TEL}</a></div>`;
  $("#foot").innerHTML = `${esc(BASIS)}<br>의무가 아니어도 자율 인증은 받을 수 있습니다. (사)한국교육녹색환경연구원`;
  document.title = `통합 인증 로드맵 · ${FAC_L[pick.f]} ${ACT_UI[pick.a][0]}`;
}
render();
</script>
</body>
</html>
